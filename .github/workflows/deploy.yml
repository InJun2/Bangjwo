name: Deploy to AWS Lightsail

# main 브랜치에 push 될 때마다 이 작업이 자동으로 실행됩니다.
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 레포지토리 코드 가져오기
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. 백엔드 빌드를 위한 Java 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Spring Boot 빌드 (.jar 파일 생성)
      # (주의: 백엔드 폴더명이 back-end 이므로 해당 폴더로 이동해서 빌드)
      - name: Build with Gradle
        working-directory: ./back-end
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. 도커 허브 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 백엔드 도커 이미지 빌드 및 허브에 푸시
      - name: Build and Push Backend Docker Image
        working-directory: ./back-end
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/bangjwo-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/bangjwo-backend:latest

      # 6. 통째로 넣은 ENV_FILE 시크릿을 실제 .env 파일로 변환
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 7. 완성된 .env 파일과 docker-compose.yml을 AWS 서버로 전송 (SCP)
      - name: Copy files to AWS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          source: "docker-compose.yml,.env"
          target: "/home/ubuntu/Bangjwo"

      # 8. AWS 서버에 SSH로 접속해서 도커 컴포즈 실행!
      - name: Execute Docker Compose on AWS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          script: |
            cd /home/ubuntu/Bangjwo
            
            # 도커 허브에서 방금 구운 최신 이미지를 당겨옵니다.
            sudo docker-compose pull
            
            # 기존 컨테이너를 내리고 새 컨테이너를 백그라운드(-d)로 실행합니다.
            sudo docker-compose up -d
            
            # 사용하지 않는 찌꺼기 이미지들을 청소해서 용량을 확보합니다.
            sudo docker image prune -f